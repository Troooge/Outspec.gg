  <text x="540" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-2" fill="url(#word)">Augury</text>
  <text x="546" y="258" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#c4b5fd">Your League of Legends Arena companion</text>
