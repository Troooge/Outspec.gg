  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="90" cy="60" r="1.5"/><circle cx="210" cy="330" r="1"/><circle cx="380" cy="80" r="1.2"/>
    <circle cx="1180" cy="70" r="1.5"/><circle cx="1060" cy="340" r="1"/><circle cx="930" cy="50" r="1.2"/>
    <circle cx="560" cy="360" r="1"/><circle cx="760" cy="30" r="1"/><circle cx="1230" cy="250" r="1.2"/>
    <circle cx="40" cy="220" r="1"/><circle cx="300" cy="200" r="0.8"/><circle cx="1000" cy="180" r="0.8"/>
  </g>
  <circle cx="300" cy="200" r="190" fill="url(#glow)"/>
  <!-- eye / orb mark -->
  <g transform="translate(300 200)">
    <path d="M-120 0 Q0 -95 120 0 Q0 95 -120 0 Z" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linejoin="round"/>
    <circle r="52" fill="#1e1240" stroke="#a78bfa" stroke-width="5"/>
    <circle r="30" fill="url(#gold)"/>
    <circle cx="-10" cy="-10" r="9" fill="#fffbeb" opacity="0.85"/>
    <g stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-112" x2="0" y2="-140"/><line x1="0" y1="112" x2="0" y2="140"/>
      <line x1="-80" y1="-80" x2="-98" y2="-98"/><line x1="80" y1="-80" x2="98" y2="-98"/>
      <line x1="-80" y1="80" x2="-98" y2="98"/><line x1="80" y1="80" x2="98" y2="98"/>
    </g>
