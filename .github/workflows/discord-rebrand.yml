name: Discord Rebrand (One-Shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/discord/rebrand.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
