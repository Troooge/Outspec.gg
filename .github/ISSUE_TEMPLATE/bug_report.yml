name: 🐞 Bug report
description: Something in Augury isn't working right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Augury better! Please search existing issues first. If yours is already there, add a 👍 instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start an Arena match
        2. Open the augment overlay
        3. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Augury, open Settings → Copy diagnostics and paste here. It includes your version and setup.
      render: text
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag files here. Please blur out anything personal.
