name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Augury, go to Settings → Copy diagnostics and paste the result here.
      render: text
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots
      description: Optional.
