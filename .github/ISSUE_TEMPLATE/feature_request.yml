name: 💡 Feature request
description: Suggest an idea for Augury
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "During augment picks I can't tell…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How do you imagine it working?
    validations:
      required: true
